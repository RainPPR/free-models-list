name: Update Models

on:
  push:
  schedule:
    # 每 8 小时执行一次 理论上是 00:00 08:00 16:00
    - cron: 0 */8 * * *
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  update-models:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      
      - name: Install dependencies
        run: uv sync --locked
      
      - name: Generate Kilo AI Math config
        run: uv run python kilo-free-ai-math.py

      - name: Generate OpenCode AI Math config
        run: uv run python opencode-free-ai-math.py

      - name: Generate LogFare AI Math config
        run: uv run python logfare-ai-math.py

      - name: Generate Poe AI Math config
        run: uv run python poe-free-ai-math.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff --staged --quiet || git commit -m "Update models data [skip ci]"
          git push
